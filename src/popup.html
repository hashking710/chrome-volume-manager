<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Volume Manager</title>
</head>

<body>
  <main class="panel">
    <header class="header">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M3 9v6h4l5 4V5L7 9H3Z"></path>
          <path d="M16 9a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"></path>
        </svg>
      </span>
      <div class="heading">
        <h1>Volume Manager</h1>
        <p>Current tab</p>
      </div>
    </header>

    <section class="volume-section" aria-labelledby="volume-heading">
      <div class="volume-reading">
        <div>
          <h2 id="volume-heading">Volume</h2>
          <p id="volume-description">Fine-tune from silent to 6×</p>
        </div>
        <output id="volume-label" for="volume-slider" aria-live="off">
          <span id="volume-value">100</span><span class="unit">%</span>
        </output>
      </div>

      <input id="volume-slider" type="range" min="0" max="600" step="5" value="100"
        aria-label="Tab volume" aria-describedby="volume-description" disabled>

      <div class="range-labels" aria-hidden="true">
        <span>0%</span>
        <span>100%</span>
        <span>300%</span>
        <span>600%</span>
      </div>

      <div class="presets" role="group" aria-label="Volume presets">
        <button type="button" data-volume="50" disabled>50%</button>
        <button type="button" data-volume="100" disabled>100%</button>
        <button type="button" data-volume="150" disabled>150%</button>
        <button type="button" data-volume="200" disabled>200%</button>
      </div>
    </section>

    <footer class="footer">
      <p id="status" role="status" aria-live="polite">Only affects this tab</p>
      <button id="mute-button" class="mute-button" type="button" aria-pressed="false" disabled>
        <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M3 7.5v5h3.2l4 3.2V4.3l-4 3.2H3Z"></path>
          <path class="mute-slash" d="m13 7 4 6m0-6-4 6"></path>
        </svg>
        <span>Mute</span>
      </button>
    </footer>
  </main>

  <script src="popup.js" defer></script>
</body>

</html>
